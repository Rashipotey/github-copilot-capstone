name: docsync

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run pytest
        run: python -m pytest -q

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install security scanners
        run: python -m pip install pip-audit bandit
      - name: Audit installed dependency environment
        run: pip-audit
      - name: Scan source with Bandit
        run: bandit -r src/